# =============================================================================
# SMS replication — MAS S$NEER policy decisions, 1994-2026 (IMPLEMENTATION_PLAN.md, P1.12)
# =============================================================================
# Public MAS sources only (D1). Used to check that the S$NEER proxy's trend
# slope matches the announced stance in each policy episode.
#
# 2001-2026: every Monetary Policy Statement (first published 22 Feb 2001), read
#   from mas.gov.sg and cross-checked against MAS's "Past monetary policy
#   decisions" table -- confidence high. Spot-checked 2026-10-27 against the
#   statements of 12 Apr 2004, 14 Apr 2010 and 30 Mar 2020.
# 1994-2000: no statements were published; stance periods reconstructed from
#   MAS annual reports and a 2001 MAS monograph -- confidence medium/low, dates
#   approximate (`date_precision`), band centre unknown. "Steady" (late 1996)
#   and the H2-1998 easing are recorded as a zero slope; MAS does not say so.
# No MAS source found mentions a depreciating slope in 1994-2026.
#
# Fields: date, scheduled (false = off-cycle), slope_change, slope_stance
# (after the decision), centre, width, quote, url, confidence, and optional
# date_precision / period_end / note.
# =============================================================================


decisions:

  # ---------------------------------------------------------------- 1994-2000 (no published statements)
  - date: 1994-01-01
    date_precision: period
    period_end: 1996-12-31
    scheduled: true
    slope_change: unchanged
    slope_stance: appreciation
    centre: unknown
    width: unchanged
    quote: "Before the crisis, MAS allowed a trend appreciation of the Singapore Dollar, in line with the rapid growth of economic activity and an economy that was operating at full capacity."
    url: https://www.mas.gov.sg/-/media/MAS/resource/about_us/annual_reports/annual19981999/MASAnnual9899.pdf
    confidence: low
    note: >-
      Prevailing stance, not a dated decision. Corroborated by MAS monograph "Singapore's Exchange
      Rate Policy" (Feb 2001): "The NEER rose by about 50% between 1988-97 or 4.1% per year, to keep
      inflationary pressures in check" (https://www.mas.gov.sg/-/media/MAS/manual-migration/Monographs/exchangePolicy.pdf).
      No primary source found for individual 1994-1996 reviews (annual reports 1994/95-1996/97 not online).

  - date: 1996-10-01
    date_precision: period
    scheduled: true
    slope_change: decrease
    slope_stance: zero
    centre: unknown
    width: unchanged
    quote: "The steady Singapore Dollar exchange rate policy stance that was adopted in late 1996, continued in 1997."
    url: https://www.mas.gov.sg/-/media/MAS/resource/about_us/annual_reports/annual19971998/MASAnnual9798.pdf
    confidence: low
    note: >-
      Date is only "late 1996". "Steady" is interpreted as a flat (zero-slope) path; MAS does not
      say "zero percent appreciation" here. The 2001 monograph notes S$/US$ "remained relatively
      stable" from Jun 95 for two years. Treat slope_stance as uncertain (zero vs reduced appreciation).

  - date: 1997-10-01
    date_precision: period
    scheduled: false
    slope_change: unchanged
    slope_stance: zero
    centre: unknown
    width: widened
    quote: "the policy band, which was widened towards the end of 1997 in response to heightened foreign exchange volatility, remained in place as financial markets continued to be extremely volatile through 1998."
    url: https://www.mas.gov.sg/-/media/MAS/resource/about_us/annual_reports/annual19981999/MASAnnual9899.pdf
    confidence: medium
    note: >-
      Exact date not published ("towards the end of 1997"); scheduled status unknown (crisis response,
      treated as off-cycle). AR 1997/98 also: "the trade-weighted Singapore Dollar was allowed to
      fluctuate within a wider range". The 2001 monograph says MAS let the NEER "rise above the policy
      band" in late-97/early-98 and "only brought down the NEER to within the policy band months later".

  - date: 1998-07-01
    date_precision: half-year
    scheduled: true
    slope_change: decrease
    slope_stance: zero
    centre: unknown
    width: unchanged
    quote: "Following an easing of monetary conditions in the second half of 1998, a neutral policy stance was maintained throughout 1999."
    url: https://www.mas.gov.sg/-/media/MAS/resource/about_us/annual_reports/annual19992000/MASAnnual9900.pdf
    confidence: low
    note: >-
      AR 1998/99: "MAS has therefore adopted an easier policy stance." MAS does not say whether the
      easing was a slope cut, a downward re-centring, or both, nor whether the slope went below zero;
      "neutral" (1999) is recorded as zero slope. A depreciating slope in H2 1998 cannot be ruled out
      from MAS sources found. Centre unknown.

  - date: 1999-01-01
    date_precision: year
    scheduled: true
    slope_change: unchanged
    slope_stance: zero
    centre: unknown
    width: narrowed
    quote: "greater stability in financial and currency markets compared with 1998 also allowed the exchange rate band, within which the Singapore Dollar exchange rate can fluctuate, to be narrowed back to its pre-crisis level."
    url: https://www.mas.gov.sg/-/media/MAS/resource/about_us/annual_reports/annual19992000/MASAnnual9900.pdf
    confidence: medium
    note: "Narrowing occurred at an unspecified point in 1999. Neutral stance held throughout 1999 (same report)."

  - date: 2000-01-01
    date_precision: half-year
    scheduled: true
    slope_change: increase
    slope_stance: appreciation
    centre: unknown
    width: unchanged
    quote: "MAS decided early in 2000 to embark on a gradual tightening of monetary policy. This involved the adoption of a target path for the exchange rate that allowed for a modest, trend appreciation of the Singapore Dollar on a trade-weighted basis."
    url: https://www.mas.gov.sg/-/media/mas/resource/about_us/annual_reports/monetary-authority-of-singapore-annual-report-2000-2001.pdf
    confidence: medium
    note: "Exact date not published ('early in 2000'). Same report: NEER reached 'the upper bound of the policy band by the end of the year' 2000."

