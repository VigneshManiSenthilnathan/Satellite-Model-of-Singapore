# -----------------------------------------------------------------------------
# 5. Bloomberg economist consensus forecasts (ECFC) — foreign outlook for
#    conditional forecasts (decision D6, P5.6). Tickers roll with the year:
#    replace {yy} with a two-digit calendar year (e.g. "ECGDUS 26 Index").
#    Verified for {yy}=26. Quarterly variants exist for some countries as
#    "ECGQ{cc} Q{q}{yy} Index"; verify per country before relying on them.
#    Note Bloomberg country codes here: JP (not JN), TW (not TA), BR (not BZ),
#    GB (not UK).
# -----------------------------------------------------------------------------
consensus:
  templates:
    gdp:          "ECGD{cc} {yy} Index"   # consensus real GDP growth, calendar-year average, %
    cpi:          "ECPI{cc} {yy} Index"   # consensus CPI inflation, calendar-year average, %
    policy_rate:  "ECPO{cc} {yy} Index"   # consensus policy rate, year-end median, % — US resolves but returns NO DATA; see known_gaps.us_policy_rate_consensus
  countries: [US, EU, JP, CN, HK, IN, ID, KR, MY, PH, TW, TH, BR, MX, CL, CO, PE, AU, CA, GB, SG]   # all verified for GDP and CPI
  policy_rate_countries: [US]   # ECPOEU / ECPOJN / ECPOCN / ECPOSG do not exist

# -----------------------------------------------------------------------------
# 6. Known gaps and checks — resolve during P1.4–P1.14
# -----------------------------------------------------------------------------
known_gaps:
  csi_lending_post_2021: >-
    No Singapore lending-rate series found after 2021Q2 (prime lending rate and
    IMF lending rate both stop; the housing-loan rate stops 2022Q4). Deposit
    rates continue via the SPLRW* weighted-average series. Options: search the
    Terminal for MAS's post-2021 lending-rate tables (ECST <GO> Singapore >
    Interest rates); use the MAS website statistics as a non-Bloomberg source;
    or rely on the NIM component alone after 2021.
  nim_start: >-
    Bank NIM data start 2002-03, so the CSI blend (D3) is spread-only before
    2003. Record how the blend is handled pre-2003 in P1.13a.
  nodx_partner_breaks: >-
    NODX to India stops 2024Q4; NODX to the Philippines and Australia have
    almost no history. Use total exports (SEMC*) for those partners, or
    re-weight NODX shares over available partners.
  indonesia_gdp_level: >-
    No SA real GDP level for Indonesia on Bloomberg. Build an NSA level from
    y/y growth and an anchor year, then seasonally adjust (P1.10).
  units_to_confirm: >-
    CGE9ANN (Canada) and PHNAGDP (Philippines) need DES <GO> checks: their
    latest values look like growth rates rather than levels.
  sibor_rs_backcast: >-
    SIBOR starts 1999Q3. RS before then uses the IMF interbank money-market
    rate (5766586), which may be an overnight rather than a 3-month rate;
    check the definition and level difference over the 1999-2021 overlap.
  us_policy_rate_consensus: >-
    ECPOUS {yy} Index resolves ("US Federal Funds Rate Forecast") but has no
    PX_LAST, neither reference nor history, for any year 2015-2028 (checked
    2026-10-27 with collect_data). Needed for the RR_US forecast path in P5.6.
    Options: find the field that carries the value (FLDS), or use another
    source for the expected fed funds path (e.g. fed funds futures / OIS).
  bloc_membership: >-
    Countries are assigned to blocs provisionally. Confirm GPM7 EA7/LA7/RC7
    membership in P3.7 and update the `bloc` keys.
