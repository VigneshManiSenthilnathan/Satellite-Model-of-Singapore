# =============================================================================
# SMS replication — Bloomberg ticker registry
# =============================================================================
# Single source of truth for every Bloomberg series the project pulls
# (IMPLEMENTATION_PLAN.md, P1.4–P1.6). Code must read tickers from here,
# never hard-code them.
#
# Verified 2026-10-27 against the Terminal via data/bloomberg.py:
#   - every ticker resolved with bdp(NAME)
#   - every series ticker returned PX_LAST history with bdh(QUARTERLY)
#   - `span` = first -> last quarter with data at that date (end-of-quarter
#     sampling, so monthly series show their quarter-end month)
# All verification pulls are cached under data/raw/bloomberg/ (git-ignored).
#
# Entry keys
#   ticker  Bloomberg ticker, API form ("CODE Yellowkey")
#   var     model variable / input it feeds (see README "Full Model Specification")
#   role    primary    — the series used by default
#           history    — older/longer series used to back-cast or splice the primary
#           post       — successor series used after the primary ends
#           crosscheck — alternative used only for validation (P1.12, P1.14)
#           reference  — not a model input; kept for comparison/context
#   freq    native frequency: D, M, Q
#   sa      true = seasonally adjusted at source; false = NSA (adjust in P1.10)
#   form    level | index | qoq | qoq_saar | yoy | rate  (how to transform, P1.13)
#   span    verified data range
#   field   Bloomberg field (default PX_LAST)
#   status  verified (default) | check_units | gap (see `known_gaps` at bottom)
#
# Bloomberg licensing: tickers are fine to commit; pulled data is not.
# =============================================================================

meta:
  verified_on: 2026-10-27
  default_field: PX_LAST
  blpapi_version: 3.26.9.1

# -----------------------------------------------------------------------------
# 1. Singapore — the six domestic observables
# -----------------------------------------------------------------------------
singapore:

  gdp:   # -> LGDP = 100*ln(real GDP)
    - {ticker: "SGDSTOTL Index", var: LGDP, role: primary,    freq: Q, sa: true,  form: level,    span: 1980Q1-2026Q2}  # Singapore real GDP, chained 2015 S$ million, SA level
    - {ticker: "SGDSTOTQ Index", var: LGDP, role: crosscheck, freq: Q, sa: true,  form: qoq,      span: 1980Q1-2026Q3}  # Singapore real GDP SA, q/q % (includes advance estimate for the latest quarter)
    - {ticker: "SGDPQOQ Index",  var: LGDP, role: crosscheck, freq: Q, sa: true,  form: qoq_saar, span: 1980Q1-2026Q2}  # Singapore real GDP, q/q % SAAR

  cpi:   # -> LCPI = 100*ln(CPI); PIE = 4*dLCPI
    - {ticker: "SICPISA Index",  var: LCPI, role: primary,    freq: M, sa: true,  form: index,    span: 1980Q1-2026Q3}  # Singapore CPI all items, SA (SingStat)
    - {ticker: "SICPI Index",    var: LCPI, role: crosscheck, freq: M, sa: false, form: index,    span: 1980Q1-2026Q3}  # Singapore CPI all items, NSA
    - {ticker: "5766639 Index",  var: LCPI, role: crosscheck, freq: M, sa: false, form: index,    span: 1980Q1-2026Q3}  # IMF IFS Singapore CPI (independent source check)
    - {ticker: "SICPMAS Index",  var: none, role: reference,  freq: M, sa: false, form: index,    span: 1990Q1-2026Q3}  # MAS Core Inflation index (not in the SMS; for comparison charts only)

  unemployment:   # -> UNR
    - {ticker: "SIQUTOTA Index", var: UNR,  role: primary,    freq: Q, sa: true,  form: rate,     span: 1992Q1-2026Q2}  # Singapore overall unemployment rate, SA, % (MOM)
    - {ticker: "SIQUTOTM Index", var: UNR,  role: crosscheck, freq: M, sa: true,  form: rate,     span: 2020Q2-2026Q3}  # Singapore overall unemployment rate, monthly SA, % (for the latest-quarter nowcast)
    - {ticker: "SIUNTOTA Index", var: UNR,  role: history,    freq: Q, sa: true,  form: rate,     span: 1992Q1-2005Q2}  # Singapore overall unemployment rate SA, old (discontinued) series

  interest_rate:   # -> RS, 3-month interbank rate, % p.a. Splice rule: P1.11
    - {ticker: "SIBF3M Index",   var: RS,   role: primary,    freq: D, sa: false, form: rate,     span: 1999Q3-2024Q4}  # 3M SGD SIBOR fixing (ABS), discontinued after 31 Dec 2024
    - {ticker: "SORACA3M Index", var: RS,   role: post,       freq: D, sa: false, form: rate,     span: 2005Q4-2026Q3}  # Compounded SORA, 3-month average (MAS) — successor to SIBOR
    - {ticker: "5766586 Index",  var: RS,   role: history,    freq: M, sa: false, form: rate,     span: 1980Q1-2021Q3}  # IMF IFS Singapore interbank money-market rate — back-cast RS before 1999Q3
    - {ticker: "XSORA3M Index",  var: RS,   role: crosscheck, freq: D, sa: false, form: rate,     span: 2017Q1-2026Q3}  # Bloomberg-calculated 3M compounded SORA (ISDA fallback basis)
    - {ticker: "SIBCSORA Index", var: RS,   role: reference,  freq: D, sa: false, form: rate,     span: 2005Q3-2026Q3}  # SORA overnight rate
    - {ticker: "5766R003 Index", var: RS,   role: reference,  freq: M, sa: false, form: rate,     span: 1980Q1-2013Q3}  # IMF IFS Singapore T-bill rate (discontinued)

  neer:   # -> LS = 100*ln(S$NEER). Decision D2: BIS broad NEER
    - {ticker: "NBISSING Index", var: LS,   role: primary,    freq: M, sa: false, form: index,    span: 1994Q1-2026Q3}  # BIS nominal effective exchange rate, broad basket, Singapore
    - {ticker: "576.023 Index",  var: LS,   role: history,    freq: M, sa: false, form: index,    span: 1980Q1-2026Q2}  # IMF IFS Singapore NEER — back-cast before 1994 and cross-check
    - {ticker: "SNEER Index",    var: LS,   role: crosscheck, freq: D, sa: false, form: index,    span: 1999Q1-2026Q3}  # Bloomberg S$NEER index (Jan 1999=100)
    - {ticker: "GSSGSGD Index",  var: LS,   role: crosscheck, freq: D, sa: false, form: index,    span: 2001Q3-2026Q3}  # Goldman Sachs S$NEER estimate

  # -> CSI. Decision D3: blend of z-scored loan–deposit spread and banks' NIM (P1.13a).
  # MAS changed its bank-rate publications in 2021: the long series below stop
  # in 2021Q2 and the weighted-average series start in 2021Q3.
  csi_lending_rates:
    - {ticker: "SPLRPRIM Index", var: CSI,  role: primary,    freq: M, sa: false, form: rate,     span: 1983Q1-2021Q2}  # Singapore prime lending rate (MAS, banks' average)
    - {ticker: "5766615 Index",  var: CSI,  role: history,    freq: M, sa: false, form: rate,     span: 1980Q1-2021Q2}  # IMF IFS Singapore lending rate (back-cast 1980-82)
    - {ticker: "SPLRHOUS Index", var: CSI,  role: crosscheck, freq: M, sa: false, form: rate,     span: 1983Q1-2022Q4}  # Singapore 15-year housing loan rate (consumer-loan proxy)
    - {ticker: "SIIRPLRT Index", var: CSI,  role: reference,  freq: M, sa: false, form: rate,     span: 1990Q1-2003Q1}  # Singapore domestic prime lending rate (old series)
    # post-2021 lending rate: NOT FOUND — see known_gaps.csi_lending_post_2021

  csi_deposit_rates:
    - {ticker: "SPLRFD3 Index",  var: CSI,  role: primary,    freq: M, sa: false, form: rate,     span: 1983Q1-2021Q2}  # Singapore banks' 3-month fixed deposit rate
    - {ticker: "SPLRWFD3 Index", var: CSI,  role: post,       freq: M, sa: false, form: rate,     span: 2021Q3-2026Q2}  # Weighted average 3-month fixed deposit rate (< S$75k) — successor series
    - {ticker: "5766601 Index",  var: CSI,  role: history,    freq: M, sa: false, form: rate,     span: 1980Q1-2021Q2}  # IMF IFS Singapore deposit rate (back-cast 1980-82)
    - {ticker: "SIFDR3M Index",  var: CSI,  role: crosscheck, freq: M, sa: false, form: rate,     span: 1982Q1-2021Q2}  # Singapore 3-month fixed deposit rate (alternative series)
    - {ticker: "SIIRSADE Index", var: CSI,  role: crosscheck, freq: M, sa: false, form: rate,     span: 1983Q1-2021Q2}  # Singapore savings deposit rate
    - {ticker: "SPLRWSDL Index", var: CSI,  role: crosscheck, freq: M, sa: false, form: rate,     span: 2021Q3-2026Q2}  # Weighted average savings deposit rate (< S$75k)

  csi_net_interest_margin:   # field differs from PX_LAST; quarterly company fundamentals, %
    - {ticker: "DBS SP Equity",  var: CSI,  role: primary,    freq: Q, sa: false, form: rate, field: T12_NET_INT_MARGIN,           span: 2003Q1-2026Q2}  # DBS Group net interest margin, trailing 12 months, %
    - {ticker: "OCBC SP Equity", var: CSI,  role: primary,    freq: Q, sa: false, form: rate, field: T12_NET_INT_MARGIN,           span: 2003Q1-2026Q2}  # OCBC net interest margin, trailing 12 months, %
    - {ticker: "UOB SP Equity",  var: CSI,  role: primary,    freq: Q, sa: false, form: rate, field: T12_NET_INT_MARGIN,           span: 2003Q1-2026Q2}  # UOB net interest margin, trailing 12 months, %
    - {ticker: "DBS SP Equity",  var: CSI,  role: crosscheck, freq: Q, sa: false, form: rate, field: IS_NET_INT_MARGIN_COMP_BASIS, span: 2003Q1-2026Q2}  # DBS NIM, company-reported basis
    - {ticker: "OCBC SP Equity", var: CSI,  role: crosscheck, freq: Q, sa: false, form: rate, field: IS_NET_INT_MARGIN_COMP_BASIS, span: 2007Q4-2026Q2}  # OCBC NIM, company-reported basis
    - {ticker: "UOB SP Equity",  var: CSI,  role: crosscheck, freq: Q, sa: false, form: rate, field: IS_NET_INT_MARGIN_COMP_BASIS, span: 2002Q3-2026Q2}  # UOB NIM, company-reported basis

  # Forecast benchmarks for the backtest (P5.12–P5.20). Each target-year consensus
  # ticker keeps its own history, so bdh on "ECGDSG 14 Index" returns the consensus
  # for 2014 as it stood at each date (verified: 2012Q3 4.5% -> 2014Q4 3.0%). That
  # makes it an information-matched benchmark at every forecast origin.
  consensus:
    - {template: "ECGDSG {yy} Index", var: none, role: reference}  # Bloomberg consensus, Singapore real GDP growth, calendar year {yy}, %
    - {template: "ECPISG {yy} Index", var: none, role: reference}  # Bloomberg consensus, Singapore headline CPI inflation, calendar year {yy}, %
    - {template: "ECCXSG {yy} Index", var: none, role: reference}  # Bloomberg consensus, Singapore core CPI inflation, calendar year {yy}, %

  mas_spf:   # MAS Survey of Professional Forecasters, median, quarterly survey rounds (current-year forecasts)
    - {ticker: "SGCFGDP Index",  var: none, role: reference, freq: Q, form: yoy,  span: 2004Q3-2026Q3}  # MAS SPF median forecast, Singapore real GDP growth, %
    - {ticker: "SGCFCPI Index",  var: none, role: reference, freq: Q, form: yoy,  span: 2004Q3-2026Q3}  # MAS SPF median forecast, Singapore headline CPI inflation, %
    - {ticker: "SGCFUNEM Index", var: none, role: reference, freq: Q, form: rate, span: 2004Q3-2026Q3}  # MAS SPF median forecast, unemployment rate SA, %
    - {ticker: "SGCF3IBR Index", var: none, role: reference, freq: Q, form: rate, span: 2004Q3-2022Q3}  # MAS SPF median forecast, 3M interbank rate, % (survey item dropped after 2022Q3)

# -----------------------------------------------------------------------------
# 2. Singapore trade by partner — weights for YF (exports, omega_i) and LCPIF
#    (imports, xi_i). P3.8. All monthly, S$ million, current prices, NSA.
#    Use annual sums for weights, so seasonality doesn't matter.
# -----------------------------------------------------------------------------
trade:

  nodx_by_partner:   # Non-oil domestic exports (preferred for omega_i: excludes low-value-added re-exports)
    - {ticker: "SIEXTOUS Index", partner: US, role: primary,   span: 1980Q1-2026Q3}  # NODX to United States
    - {ticker: "SIEXTOEU Index", partner: EU, role: primary,   span: 1980Q1-2026Q3}  # NODX to European Union (EU aggregate, not euro area)
    - {ticker: "SIEXTOJN Index", partner: JA, role: primary,   span: 1980Q1-2026Q3}  # NODX to Japan
    - {ticker: "SIEXTOCH Index", partner: CH, role: primary,   span: 1980Q1-2026Q3}  # NODX to China
    - {ticker: "SIEXTOHK Index", partner: HK, role: primary,   span: 1980Q1-2026Q3}  # NODX to Hong Kong
    - {ticker: "SIEXTOIJ Index", partner: ID, role: primary,   span: 1980Q1-2026Q3}  # NODX to Indonesia
    - {ticker: "SIEXTOKO Index", partner: KR, role: primary,   span: 1980Q1-2026Q3}  # NODX to South Korea
    - {ticker: "SIEXTOMA Index", partner: MY, role: primary,   span: 1980Q1-2026Q3}  # NODX to Malaysia
    - {ticker: "SIEXTOTW Index", partner: TW, role: primary,   span: 1980Q1-2026Q3}  # NODX to Taiwan
    - {ticker: "SIEXTOTH Index", partner: TH, role: primary,   span: 1980Q1-2026Q3}  # NODX to Thailand
    - {ticker: "SIEXTOID Index", partner: IN, role: primary,   span: 1998Q4-2024Q4, status: gap}  # NODX to India — stops 2024Q4
    - {ticker: "SIEXTOPH Index", partner: PH, role: primary,   span: 2001Q4-2002Q4, status: gap}  # NODX to Philippines — only 2001-02; unusable
    - {ticker: "SIEXTOAU Index", partner: AU, role: primary,   span: 1998Q4-2005Q4, status: gap}  # NODX to Australia — stops 2005; unusable
    - {ticker: "SIEXOTHC Index", partner: other, role: reference, span: 1998Q4-2024Q4}  # NODX to other countries
    - {ticker: "SIEXPNO Index",  partner: total, role: reference, span: 1980Q1-2026Q2}  # Total NODX, current prices (denominator check)
    - {ticker: "SIEXDOME Index", partner: total, role: reference, span: 1980Q1-2026Q2}  # Total domestic exports (oil + non-oil), current prices

  total_exports_by_partner:   # Total exports incl. re-exports — robustness variant for omega_i, and fills NODX gaps
    - {ticker: "SEMCUSA Index",  partner: US, span: 1980Q1-2026Q3}  # Exports to United States
    - {ticker: "SEMCEZ Index",   partner: EU, span: 1999Q1-2026Q3}  # Exports to euro area (GPM7 'EU' bloc is the euro area)
    - {ticker: "SEMCEU Index",   partner: EU, role: crosscheck, span: 1999Q1-2026Q3}  # Exports to European Union
    - {ticker: "SEMCJAPN Index", partner: JA, span: 1980Q1-2026Q3}  # Exports to Japan
    - {ticker: "SEMCCHNA Index", partner: CH, span: 1980Q1-2026Q3}  # Exports to China
    - {ticker: "SEMCHK Index",   partner: HK, span: 1980Q1-2026Q3}  # Exports to Hong Kong
    - {ticker: "SEMCINDI Index", partner: IN, span: 1980Q1-2026Q3}  # Exports to India
    - {ticker: "SEMCINDO Index", partner: ID, span: 2003Q1-2026Q3}  # Exports to Indonesia (starts 2003)
    - {ticker: "SEMCKREA Index", partner: KR, span: 1980Q1-2026Q3}  # Exports to South Korea
    - {ticker: "SEMCMALY Index", partner: MY, span: 1980Q1-2026Q3}  # Exports to Malaysia
    - {ticker: "SEMCPHIL Index", partner: PH, span: 1980Q1-2026Q3}  # Exports to Philippines
    - {ticker: "SEMCTAIW Index", partner: TW, span: 1980Q1-2026Q3}  # Exports to Taiwan
    - {ticker: "SEMCTHAI Index", partner: TH, span: 1980Q1-2026Q3}  # Exports to Thailand
    - {ticker: "SEMCBRAZ Index", partner: BR, span: 1980Q1-2026Q3}  # Exports to Brazil
    - {ticker: "SEMCMEXI Index", partner: MX, span: 1980Q1-2026Q3}  # Exports to Mexico
    - {ticker: "SEMCCHIL Index", partner: CL, span: 1980Q1-2026Q3}  # Exports to Chile
    - {ticker: "SEMCCOLO Index", partner: CO, span: 1980Q1-2026Q3}  # Exports to Colombia
    - {ticker: "SEMCPERU Index", partner: PE, span: 1980Q1-2026Q3}  # Exports to Peru
    - {ticker: "SEMCAUST Index", partner: AU, span: 1980Q1-2026Q3}  # Exports to Australia
    - {ticker: "SEMCCANA Index", partner: CA, span: 1980Q1-2026Q3}  # Exports to Canada
    - {ticker: "SEMCUK Index",   partner: GB, span: 1980Q1-2026Q3}  # Exports to United Kingdom

  imports_by_partner:   # -> xi_i (import shares for LCPIF)
    - {ticker: "SIMCUSA Index",  partner: US, span: 1980Q1-2026Q3}  # Imports from United States
    - {ticker: "SIMCEZ Index",   partner: EU, span: 1999Q1-2026Q3}  # Imports from euro area
    - {ticker: "SIMCEU Index",   partner: EU, role: crosscheck, span: 1999Q1-2026Q3}  # Imports from European Union
    - {ticker: "SIMCJAPN Index", partner: JA, span: 1980Q1-2026Q3}  # Imports from Japan
    - {ticker: "SIMCCHNA Index", partner: CH, span: 1980Q1-2026Q3}  # Imports from China
    - {ticker: "SIMCHK Index",   partner: HK, span: 1980Q1-2026Q3}  # Imports from Hong Kong
    - {ticker: "SIMCINDI Index", partner: IN, span: 1980Q1-2026Q3}  # Imports from India
    - {ticker: "SIMCINDO Index", partner: ID, span: 2003Q1-2026Q3}  # Imports from Indonesia (starts 2003)
    - {ticker: "SIMCKREA Index", partner: KR, span: 1980Q1-2026Q3}  # Imports from South Korea
    - {ticker: "SIMCMALY Index", partner: MY, span: 1980Q1-2026Q3}  # Imports from Malaysia
    - {ticker: "SIMCPHIL Index", partner: PH, span: 1980Q1-2026Q3}  # Imports from Philippines
    - {ticker: "SIMCTAIW Index", partner: TW, span: 1980Q1-2026Q3}  # Imports from Taiwan
    - {ticker: "SIMCTHAI Index", partner: TH, span: 1980Q1-2026Q3}  # Imports from Thailand
    - {ticker: "SIMCBRAZ Index", partner: BR, span: 1980Q1-2026Q3}  # Imports from Brazil
    - {ticker: "SIMCMEXI Index", partner: MX, span: 1980Q1-2026Q3}  # Imports from Mexico
    - {ticker: "SIMCCHIL Index", partner: CL, span: 1980Q1-2026Q3}  # Imports from Chile
    - {ticker: "SIMCCOLO Index", partner: CO, span: 1980Q1-2026Q3}  # Imports from Colombia
    - {ticker: "SIMCPERU Index", partner: PE, span: 1980Q1-2026Q3}  # Imports from Peru
    - {ticker: "SIMCAUST Index", partner: AU, span: 1980Q1-2026Q3}  # Imports from Australia
    - {ticker: "SIMCCANA Index", partner: CA, span: 1980Q1-2026Q3}  # Imports from Canada
    - {ticker: "SIMCUK Index",   partner: GB, span: 1980Q1-2026Q3}  # Imports from United Kingdom

# -----------------------------------------------------------------------------
# 3. United States — RR_US, RR_US_BAR and the US bloc
# -----------------------------------------------------------------------------
united_states:
  - {ticker: "GDP CHWG Index", var: Y_US,      role: primary,    freq: Q, sa: true,  form: level, span: 1980Q1-2026Q2}  # US real GDP, chained $bn, SAAR level
  - {ticker: "CPI INDX Index", var: LCPI_US,   role: primary,    freq: M, sa: true,  form: index, span: 1980Q1-2026Q3}  # US CPI-U all items, SA
  - {ticker: "CPURNSA Index",  var: LCPI_US,   role: crosscheck, freq: M, sa: false, form: index, span: 1980Q1-2026Q3}  # US CPI-U all items, NSA
  - {ticker: "1116639 Index",  var: LCPI_US,   role: crosscheck, freq: M, sa: false, form: index, span: 1980Q1-2026Q3}  # IMF IFS US CPI
  - {ticker: "USGG3M Index",   var: RR_US,     role: primary,    freq: D, sa: false, form: rate,  span: 1980Q1-2026Q3}  # US generic 3-month T-bill yield, % (nominal leg of RR_US)
  - {ticker: "FDTR Index",     var: RR_US,     role: crosscheck, freq: D, sa: false, form: rate,  span: 1980Q1-2026Q3}  # Fed funds target rate, upper bound, %
  - {ticker: "CONSPXMD Index", var: RR_US,     role: primary,    freq: M, sa: false, form: rate,  span: 1980Q1-2026Q3}  # UMich expected price change next 12m, median, % (expected-inflation leg of RR_US)
  - {ticker: "CIEFMICH Index", var: RR_US,     role: crosscheck, freq: Q, sa: false, form: rate,  span: 1999Q1-2026Q3}  # Fed Common Inflation Expectations index (Michigan variant)
  - {ticker: "USNRUS Index",   var: RR_US_BAR, role: primary,    freq: Q, sa: false, form: rate,  span: 1980Q1-2026Q2}  # Holston-Laubach-Williams US natural rate of interest (r*), % — replaces the NY Fed download in P1.9

# -----------------------------------------------------------------------------
# 4. Foreign blocs — real GDP (-> bloc output gaps Y_i -> YF) and CPI (-> LCPIF)
#    Bloc assignment is PROVISIONAL until P3.7 confirms GPM7 membership.
#    EA7 lists 8 candidates; one will drop out.
#    CPI primary = IMF IFS "{IFS code}6639 Index" (one consistent, long series
#    per country), except where IFS has no series (euro area, China, Taiwan).
#    National CPI tickers are kept as cross-checks / for the latest months,
#    since IFS lags by a quarter for some countries.
# -----------------------------------------------------------------------------
foreign:

  US:   # bloc US — series in `united_states` above
    bloc: US

  EZ:
    bloc: EU
    gdp:
      - {ticker: "EUGNEMU Index",  role: primary,    freq: Q, sa: true,  form: level, span: 1995Q1-2026Q2}  # Euro area real GDP, chained 2020 prices, level
    cpi:
      - {ticker: "CPALEMU Index",  role: primary,    freq: M, sa: false, form: index, span: 1996Q1-2026Q3}  # Euro area HICP (MUICP) all items, NSA — no IFS series for the euro area

  JP:
    bloc: JA
    gdp:
      - {ticker: "JGDPGDP Index",  role: primary,    freq: Q, sa: true,  form: level, span: 1994Q1-2026Q2}  # Japan real GDP, chained, SA, level
    cpi:
      - {ticker: "1586639 Index",  role: primary,    freq: M, sa: false, form: index, span: 1980Q1-2026Q2}  # IMF IFS Japan CPI
      - {ticker: "JC20GEN Index",  role: crosscheck, freq: M, sa: false, form: index, span: 1980Q1-2026Q2}  # Japan CPI nationwide general, 2020=100

  CN:
    bloc: CH
    gdp:
      - {ticker: "CNGDPQOQ Index", role: primary,    freq: Q, sa: true,  form: qoq,   span: 2011Q1-2026Q3}  # China real GDP, q/q % SA — chain into a level index
      - {ticker: "CNGDPYOY Index", role: history,    freq: Q, sa: false, form: yoy,   span: 1992Q1-2026Q3}  # China real GDP, y/y % — back-cast before 2011
      - {ticker: "CNGDGDP Index",  role: crosscheck, freq: Q, sa: false, form: level, span: 2007Q1-2026Q3}  # China GDP at constant prices, NSA level
    cpi:
      - {ticker: "CNCPIMOM Index", role: primary,    freq: M, sa: false, form: qoq,   span: 2001Q1-2026Q3}  # China CPI m/m % — chain into an index (no IFS series for China)
      - {ticker: "CNCPIYOY Index", role: history,    freq: M, sa: false, form: yoy,   span: 1987Q1-2026Q3}  # China CPI y/y % — back-cast before 2001

  HK:
    bloc: EA7
    gdp:
      - {ticker: "HKGDQOQ Index",  role: primary,    freq: Q, sa: true,  form: qoq,   span: 1990Q1-2026Q2}  # Hong Kong real GDP (chain volume), q/q % SA — chain into a level
      - {ticker: "5329R002 Index", role: history,    freq: Q, sa: false, form: level, span: 1980Q1-2017Q1}  # IMF Hong Kong real GDP, chained volume (back-cast before 1990)
    cpi:
      - {ticker: "5326639 Index",  role: primary,    freq: M, sa: false, form: index, span: 1980Q4-2026Q2}  # IMF IFS Hong Kong CPI
      - {ticker: "HKCPI Index",    role: crosscheck, freq: M, sa: false, form: index, span: 1980Q4-2026Q3}  # Hong Kong composite CPI

  IN:
    bloc: EA7
    gdp:
      - {ticker: "INBGGDRQ Index", role: primary,    freq: Q, sa: false, form: level, span: 1996Q2-2026Q2}  # India real GDP, quarterly, NSA level — seasonally adjust (India publishes no SA series)
